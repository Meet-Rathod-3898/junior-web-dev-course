<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style_04.css">
</head>
<body>
    
    <h1>vertical flex</h1>
    <table>
        <tr>
            <td >
                <div class="start">
                    <span>1</span>
                <span>1</span>
                <span>1</span>
                <span>1</span>
                </div>
            </td>
            <td >
                <div class="end">
                    <span>1</span>
                <span>1</span>
                <span>1</span>
                <span>1</span>
                </div>
            </td>
            <td >
                <div class="center">
                    <span>1</span>
                <span>1</span>
                <span>1</span>
                <span>1</span>
                </div>
            </td>
            <td >
                <div class="space-between">
                    <span>1</span>
                <span>1</span>
                <span>1</span>
                <span>1</span>
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
